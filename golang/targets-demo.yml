# Each target is probed concurrently — total check time equals the slowest probe.

global_timeout: 3s
root_domain: "fiscalismia.com"

targets:

  internal:
    - name: "Demo Frontend"
      host: "172.20.0.2:443"
      type: tcp


    - name: "Demo Backend"
      host: "172.20.0.2:8443"
      type: tcp

    - name: "Demo WebScraper"
      host:  "172.20.0.2:8444"
      type: tcp

    - name: "Demo Golang"
      host: "172.20.0.2:8445"
      type: tcp

    - name: "Demo Frontend"
      url: "http://172.20.0.2:443/login"
      type: http
      expect_failure: true

    - name: "Demo Backend"
      url: "http://172.20.0.2:8443/api/fiscalismia/hc"
      type: http
      expect_failure: true

    - name: "Demo WebScraper"
      url: "http://172.20.0.2:8444/fastapi/fiscalismia/hc"
      type: http
      expect_failure: true

    - name: "Demo Golang"
      url: "http://172.20.0.2:8445/goapi/hc"
      type: http
      expect_failure: true

    - name: "Demo Postgres"
      host: "172.20.0.2:5432"
      type: tcp
      expect_failure: true

    - name: "Loadbalancer"
      host: "172.20.1.3:443"
      type: tcp

    - name: "Bastion Host"
      host: "172.20.1.2"
      type: icmp

    - name: "NAT Gateway"
      host: "172.20.1.4"
      type: icmp

  external:
    - name: "Demo Frontend"
      url:  "https://demo.fiscalismia.com/login"
      type: http
      x509_verify: true

    - name: "Demo Backend"
      url:  "https://backend.demo.fiscalismia.com/api/fiscalismia/hc"
      type: http
      x509_verify: true

    - name: "Demo WebScraper"
      url:  "https://fastapi.demo.fiscalismia.com/fastapi/fiscalismia/hc"
      type: http
      x509_verify: true

    - name: "Demo Golang"
      url:  "https://golang.demo.fiscalismia.com/goapi/hc"
      type: http
      x509_verify: true

    - name: "Demo Postgres"
      url:  "https://backend.demo.fiscalismia.com/api/fiscalismia/db_hc"
      x509_verify: true
      type: http

    # Demo instance does not have port 22 egress allowed in nftables, ping as fallback
    - name: "Bastion Host"
      host: "46.224.30.190"
      type: icmp

    - name: "NAT Gateway"
      host: "49.13.166.73"
      type: icmp

    - name: "Loadbalancer"
      host: "46.225.239.49:443"
      type: tcp