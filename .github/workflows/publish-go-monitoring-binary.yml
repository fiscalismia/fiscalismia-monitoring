name: Fiscalismia-Monitoring Golang Healthcheck

# on:
#   push:
#     branches:
#       - main
#       - pipeline_testing

on:
  workflow_dispatch:

jobs:
  build-and-publish-image:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read
      packages: write # to publish to ghcr.io

    steps:
    - name: Checkout SCM
      uses: actions/checkout@v6.0.2
      # https://github.com/actions/checkout

    - name: Read Version from version.json
      working-directory: ./golang
      run: |
        echo "BUILD_VERSION=$(jq -r '.version' version.json)" >> $GITHUB_ENV

    - name: Set Buildah Build Timestamp
      shell: bash
      run: |
        # Store the current time in ISO 8601 format (required by OCI spec)
        echo "BUILD_TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV

    # The Dockerfile (currently empty at golang/Dockerfile) will consume these
    # ARGs and pass them through to `go build -ldflags -X` so the binary's
    # internal/version package reports the same semver as the image tag below.
    #   ARG VERSION COMMIT BUILD_TIME
    #   RUN go build -ldflags="-s -w \
    #     -X 'github.com/fiscalismia/fiscalismia-monitoring/internal/version.Version=${VERSION}' \
    #     -X 'github.com/fiscalismia/fiscalismia-monitoring/internal/version.Commit=${COMMIT}' \
    #     -X 'github.com/fiscalismia/fiscalismia-monitoring/internal/version.BuildTime=${BUILD_TIME}'" \
    #     -trimpath -o /out/healthcheck ./cmd/healthcheck
    - name: Buildah Image Creation - Healthcheck
      id: build-image-healthcheck
      uses: redhat-actions/buildah-build@v2.13
      # https://github.com/redhat-actions/buildah-build/releases
      with:
        image: fiscalismia-monitoring-healthcheck
        tags: latest ${{ env.BUILD_VERSION }}
        context: ./golang
        containerfiles: |
          ./golang/Dockerfile
        build-args: |
          VERSION=${{ env.BUILD_VERSION }}
          COMMIT=${{ github.sha }}
          BUILD_TIME=${{ env.BUILD_TIMESTAMP }}
        labels: |
          org.opencontainers.image.version=${{ env.BUILD_VERSION }}
          org.opencontainers.image.created=${{ env.BUILD_TIMESTAMP }}
          org.opencontainers.image.source=${{ github.repositoryUrl }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.description=Healthcheck HTTP server polling external/internal targets for system landscape health monitoring
          org.opencontainers.image.licenses=MIT

    - name: Log in to Github Container Registry
      if: github.event_name == 'push'
      uses: redhat-actions/podman-login@v1.7
      # https://github.com/redhat-actions/podman-login/releases
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push Healthcheck to Github Container Registry
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      id: push-to-ghcr-healthcheck
      uses: redhat-actions/push-to-registry@v2.8
      # https://github.com/redhat-actions/push-to-registry/releases
      with:
        image: ${{ steps.build-image-healthcheck.outputs.image }}
        tags: ${{ steps.build-image-healthcheck.outputs.tags }}
        registry: ghcr.io/fiscalismia

    - name: Print image url
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        echo "Image pushed to ${{ steps.push-to-ghcr-healthcheck.outputs.registry-paths }}"
