name: Fiscalismia-Monitoring Golang Healthcheck

on:
  push:
    branches:
      - main
      - pipeline_testing

jobs:
  code-quality:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout SCM
      uses: actions/checkout@v6.0.2
      # https://github.com/actions/checkout

    - name: Set up Go
      uses: actions/setup-go@v6.4.0
      # https://github.com/actions/setup-go
      with:
        cache: true
        go-version-file: './golang/go.mod'
        cache-dependency-path: '/golang/go.sum'

    - name: Install Dependencies
      working-directory: ./golang
      run: make tidy

    - name: Ensure gofmt has been run
      working-directory: ./golang
      run: |
        set -euo pipefail
        make fmt

    - name: Lint with golangci-lint
      uses: golangci/golangci-lint-action@v9.2.0
      # https://github.com/golangci/golangci-lint-action
      with:
        working-directory: ./golang
        args: --config .golangci.yml
        version: v2.11.4

  snyk-security-scan:
    environment: prod # requires manual approval before running
    timeout-minutes: 240 # Cancels the job if it isn't approved within 4 hours
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write  # required for SARIF upload to GitHub Code Scanning

    steps:
    - name: Checkout SCM
      uses: actions/checkout@v6.0.2
      # https://github.com/actions/checkout

    - name: Set up Go
      uses: actions/setup-go@v6.4.0
      # https://github.com/actions/setup-go
      with:
        cache: true
        go-version-file: './golang/go.mod'
        cache-dependency-path: '/golang/go.sum'

    - name: Install Dependencies
      working-directory: ./golang
      run: make tidy

    - name: Set up Snyk CLI
      uses: snyk/actions/setup@master
      # https://github.com/snyk/actions/tree/master/setup

    - name: Snyk Dependency Security Analysis
      working-directory: ./golang
      continue-on-error: true  # don't block the pipeline; review results in GitHub Security tab
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      run: |
        snyk test \
          --file=go.mod \
          --org=fcdd9ceb-9451-4b30-a447-8d8f9ffa2980 \
          --severity-threshold=high \
          --sarif-file-output=${GITHUB_WORKSPACE}/snyk-open-source.sarif

    - name: Upload Snyk Open Source SARIF
      if: always()
      uses: github/codeql-action/upload-sarif@v4
      # https://docs.github.com/en/code-security/how-tos/scan-code-for-vulnerabilities/integrate-with-existing-tools/uploading-a-sarif-file-to-github
      with:
        sarif_file: snyk-open-source.sarif
        category: snyk-open-source

    - name: Snyk Static Code Security Analysis
      working-directory: ./golang
      continue-on-error: true
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      run: |
        snyk code test \
          --org=fcdd9ceb-9451-4b30-a447-8d8f9ffa2980 \
          --severity-threshold=high \
          --sarif-file-output=${GITHUB_WORKSPACE}/snyk-code.sarif

    - name: Upload Snyk Code SARIF
      if: always()
      uses: github/codeql-action/upload-sarif@v4
      # https://docs.github.com/en/code-security/how-tos/scan-code-for-vulnerabilities/integrate-with-existing-tools/uploading-a-sarif-file-to-github
      with:
        sarif_file: snyk-code.sarif
        category: snyk-code

  build-and-publish-image:
    needs: code-quality
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read
      packages: write # to publish to ghcr.io

    steps:
    - name: Checkout SCM
      uses: actions/checkout@v6.0.2
      # https://github.com/actions/checkout

    - name: Read Version from version.json
      working-directory: ./golang
      run: |
        echo "BUILD_VERSION=$(jq -r '.version' version.json)" >> $GITHUB_ENV

    - name: Set Buildah Build Timestamp
      shell: bash
      run: |
        # Store the current time in ISO 8601 format (required by OCI spec)
        echo "BUILD_TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV

    - name: Buildah Image Creation - Demo
      id: build-demo-image
      uses: redhat-actions/buildah-build@v2.13
      # https://github.com/redhat-actions/buildah-build/releases
      with:
        image: fiscalismia-healthcheck-demo
        tags: latest ${{ env.BUILD_VERSION }}
        context: ./golang
        containerfiles: |
          ./golang/Dockerfile
        build-args: |
          ENVIRONMENT=demo
          VERSION=${{ env.BUILD_VERSION }}
          COMMIT=${{ github.sha }}
          BUILD_TIME=${{ env.BUILD_TIMESTAMP }}
        labels: |
          org.opencontainers.image.version=${{ env.BUILD_VERSION }}
          org.opencontainers.image.created=${{ env.BUILD_TIMESTAMP }}
          org.opencontainers.image.source=${{ github.repositoryUrl }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.description=Demo Golang HTTP server concurrently polling external/internal targets for unified system landscape health monitoring
          org.opencontainers.image.licenses=MIT

    - name: Buildah Image Creation - Production
      id: build-production-image
      uses: redhat-actions/buildah-build@v2.13
      # https://github.com/redhat-actions/buildah-build/releases
      with:
        image: fiscalismia-healthcheck
        tags: latest ${{ env.BUILD_VERSION }}
        context: ./golang
        containerfiles: |
          ./golang/Dockerfile
        build-args: |
          ENVIRONMENT=production
          VERSION=${{ env.BUILD_VERSION }}
          COMMIT=${{ github.sha }}
          BUILD_TIME=${{ env.BUILD_TIMESTAMP }}
        labels: |
          org.opencontainers.image.version=${{ env.BUILD_VERSION }}
          org.opencontainers.image.created=${{ env.BUILD_TIMESTAMP }}
          org.opencontainers.image.source=${{ github.repositoryUrl }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.description=Production Golang HTTP server concurrently polling external/internal targets for unified system landscape health monitoring
          org.opencontainers.image.licenses=MIT

    - name: Log in to Github Container Registry
      if: github.event_name == 'push'
      uses: redhat-actions/podman-login@v1.7
      # https://github.com/redhat-actions/podman-login/releases
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push Demo Image to GHCR
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      id: push-demo-to-ghcr
      uses: redhat-actions/push-to-registry@v2.8
      # https://github.com/redhat-actions/push-to-registry/releases
      with:
        image: ${{ steps.build-demo-image.outputs.image }}
        tags: ${{ steps.build-demo-image.outputs.tags }}
        registry: ghcr.io/fiscalismia

    - name: Push Production Image to GHCR
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      id: push-prod-to-ghcr
      uses: redhat-actions/push-to-registry@v2.8
      # https://github.com/redhat-actions/push-to-registry/releases
      with:
        image: ${{ steps.build-production-image.outputs.image }}
        tags: ${{ steps.build-production-image.outputs.tags }}
        registry: ghcr.io/fiscalismia

    - name: Print image url
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        echo "Production Image pushed to ${{ steps.push-prod-to-ghcr.outputs.registry-paths }}"
        echo "Demo Image pushed to ${{ steps.push-demo-to-ghcr.outputs.registry-paths }}"
